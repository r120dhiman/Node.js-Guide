<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <style>
        body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  
        #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
        #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
        #input:focus { outline: none; }
        button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: white; }
  
        #message { list-style-type: none; margin: 0; padding: 0; }
        #message > li { padding: 0.5rem 1rem; }
        #message > li:nth-child(odd) { background: #efefef; }
      </style>
</head>

<body>
    <h1>hello</h1>
    <button onclick="connectfn()" id="connectionstatus">Connect With the server</button>
    <input type="text" name="message" id="messages" placeholder="Enter message">
    <button id="send">Send</button>
    <div id="allmsg"><h1>Here are all the messages</h1></div>

    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const allmsg = document.getElementById('allmsg');

        function connectfn() {
            const socket = io();

            socket.on("connect", () => {
                document.getElementById('connectionstatus').innerText = "Disconnect";
            });
            socket.on("message", (msg) => {
                const newmsg = document.createElement("p");
                newmsg.innerText = msg;
                allmsg.appendChild(newmsg);
            });

            const send = document.getElementById('send');
            const msg = document.getElementById('messages');

            // Send message to the server when "Send" is clicked
            send.addEventListener("click", (e) => {
                const msg_value = msg.value;
                socket.emit('user_message', msg_value);
                msg.value = "";  // Clear the input after sending
            });
        }
        if (localStorage.socket.id) {
            
        }
    </script>
</body>

</html>
